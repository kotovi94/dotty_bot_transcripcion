name: Dotty CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test data directory
        run: mkdir -p data

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate transcription diagnostics Python
        run: |
          python -m pip install pytest==8.4.1
          python -m py_compile \
            services/transcriber/dotty_transcriber/config.py \
            services/transcriber/dotty_transcriber/diagnostics.py \
            services/transcriber/dotty_transcriber/main.py
          cd services/transcriber
          python -m pytest tests/test_diagnostics.py -q
