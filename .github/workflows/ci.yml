name: Dotty CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test data directory
        run: mkdir -p data

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
